<body>
  <div class="container">
    <div class="row">
      <h3 class="text-center" >SIMPLE METEOR CHAT</h3>
      <h5 class="text-center text-muted">Sign in to join!</h5>
      <div class="col-md-12">
        {{> loginButtons}}

        {{#if currentUser}}

        <section class="message">
          <div class="center">

          <div class="grid-message panel-body">
            <!-- message template -->
             {{#each messages}}
                {{> message}}
              {{/each}}
          </div>
          <!-- message textbox -->
          <div class="message-box">
            <input type="text" name="text" class="form-control" placeholder="Type a message..." />
          </div>
          </div>

        </section>

        {{/if}}


      </div>
    </div>
  </div>
</body>
