<template name="itinerary">
            {{#each this}}
		<div class="row">
  <div class="col-sm-6 col-md-4">
    <div class="thumbnail">
      <img src="images/nyc_cover.png" alt="...">
      <div class="caption">
          <p><u>To:</u> {{to}}</p>
          <p><u>From:</u> {{from}}</p>
          <p><u>Depart:</u> {{depart}}</p>
          <p><u>Return:</u> {{return}}</p>
          <p><u>Itinerary:</u> {{package.name}} <span class="pull-right">{{package.price}}</span></p>
          <p><u>Flight:</u> {{flight.name}} <span class="pull-right">{{flight.price}}</span></p>
          <p><u>Hotel:</u> {{hotel.name}} <span class="pull-right">{{hotel.price}}</span></p>
          <p><u>Total:</u> {{total}}</p>
      </div>
    <p style="padding-bottom: 10px;"><a class="btn btn-danger btn-outline get-this" style="width:100%;">Pay</a></p>
    </div>
  </div>
</div>
            {{/each}}
</template>
