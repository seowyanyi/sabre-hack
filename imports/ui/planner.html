<template name="planner">
    {{#each this}}
	<div class="item">
        <p><u>To:</u> {{to}} {{#unless to}}<img src="http://www.darwinrecruitment.com/img/ajax-loader.png" style="height:100px;">{{/unless}}</p>
        {{#if from}}<p><u>From:</u> {{from}}</p>
        {{else}}
        <p><u>From:</u> <img src="http://www.darwinrecruitment.com/img/ajax-loader.png" style="height:100px;"></p>
        {{/if}}

        {{#if to}}
        {{#if depart}}<p><u>Depart:</u> {{depart}}</p>
                {{else}}
        <p><u>Depart:</u> <img src="http://www.darwinrecruitment.com/img/ajax-loader.png" style="height:100px;"></p>
        {{/if}}
        {{/if}}
        {{#if depart}}
        {{#if return}}<p><u>Return:</u> {{return}}</p>
                {{else}}
        <p><u>Return:</u> <img src="http://www.darwinrecruitment.com/img/ajax-loader.png" style="height:100px;"></p>
        {{/if}}
        {{/if}}
	</div>
    {{/each}}
</template>
