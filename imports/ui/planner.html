        {{#if from}}<p>From: {{from}}</p>
        {{else}}
        <p>From: <img src="http://www.darwinrecruitment.com/img/ajax-loader.png" style="height:100px;"></p>
        {{/if}}

        {{#if to}}
        {{#if depart}}<p>Depart: {{depart}}</p>
                {{else}}
        <p>Depart: <img src="http://www.darwinrecruitment.com/img/ajax-loader.png" style="height:100px;"></p>
        {{/if}}
        {{/if}}
        {{#if depart}}
        {{#if return}}<p>Return: {{return}}</p>
                {{else}}
        <p>Return: <img src="http://www.darwinrecruitment.com/img/ajax-loader.png" style="height:100px;"></p>
        {{/if}}
        {{/if}}

</template>
