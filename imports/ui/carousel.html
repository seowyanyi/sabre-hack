<template name="carousel">

	<div class="owl-carousel">
            {{#each this}}
		<div class="item">
            <p style="padding-bottom: 10px;"><a class="btn btn-primary btn-outline" style="width:100%;">Get This</a></p>
			<img src="{{thumbnail}}" alt="Owl Image">
			<p>{{title}} {{price}}</p>
			<p style="line-height: normal; padding-bottom:20px;"><small>{{description}}...</small></p>
		</div>
            {{/each}}
	</div>

</template>
