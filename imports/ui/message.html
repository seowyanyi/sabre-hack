<template name="message">
  {{#if isReceived username}}
    <div class="col-message-received">
      <div class="message-received">
        <p>{{text}}</p>
      </div>
    </div>
  {{else}}
    <div class="col-message-sent">
      <div class="message-sent">
        <p>{{text}}</p>
      </div>
    </div>
  {{/if}}
</template>
