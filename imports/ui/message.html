<template name="message">
	{{#if isCarousel}}
	<div style="width:383px;overflow-x: hidden; padding:10px;">
		{{> carousel}}
	</div>
	{{else}} {{#if isReceived username}}
	<div class="col-message-received">
		<div class="message-received">
			<p>{{text}}</p>
			{{#if isCarousel type}}
      {{> carousel metaData}}
	{{/if}}
      {{#if isTwo type}}
      {{> planner metaData}}
      {{/if}}
	        {{#if isItinerary type}}
			{{> itinerary metaData}}
      {{/if}}
	  	        {{#if isFlight type}}
			{{> flight metaData}}
      {{/if}}

	  	  	        {{#if isHotel type}}
			{{> hotel metaData}}
      {{/if}}
		</div>
	</div>
	{{else}}
	<div class="col-message-sent">
		<div class="message-sent">
			<p>{{text}}</p>
			<p> <img class="img-circle pull-right" src="images/yl_bubble_pic.png" style="width:25px;"></p>
		</div>
		
	</div>
	{{/if}} {{/if}}
</template>
